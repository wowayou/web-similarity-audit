[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-similarity-audit"
version = "0.1.0"
description = "CLI tool for auditing web page similarity with explicit failure reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Web Similarity Audit" }
]
dependencies = [
    "httpx[http2,brotli]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
web-similarity-audit = "web_similarity_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_similarity_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]
