name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: When I run X, Y happens instead of Z
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command: web-similarity-audit --crawl https://example.com
        2. Wait for crawl to complete
        3. Check output in audit-results/
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The audit should complete successfully and generate reports
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: The audit crashed with error XYZ
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Please paste any error messages or stack traces
      render: shell
      placeholder: |
        $ web-similarity-audit --crawl https://example.com
        ERROR: ...

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `web-similarity-audit --version`
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "Python 3.10.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - WSL (Windows Subsystem for Linux)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: e.g., Ubuntu 22.04, macOS 13.0, Windows 11
      placeholder: Ubuntu 22.04

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - pipx
        - pip
        - From source (git clone)
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: This only happens when crawling sites with >100 pages...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have checked the [FAQ](https://github.com/wowayou/web-similarity-audit/blob/main/docs/FAQ.md)
          required: true
        - label: I am using the latest version
          required: false
