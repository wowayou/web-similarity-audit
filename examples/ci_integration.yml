# Example GitHub Actions workflow for SEO content audit
name: Weekly Content Audit

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install web-similarity-audit
      run: pipx install web-similarity-audit
    
    - name: Run audit
      run: |
        web-similarity-audit \
          --crawl https://example.com \
          --max-pages 500 \
          --output audit-results
    
    - name: Check for high-priority duplicates
      id: check
      run: |
        P1_COUNT=$(grep -c ",P1," audit-results/pairs.csv || echo "0")
        echo "p1_count=$P1_COUNT" >> $GITHUB_OUTPUT
        if [ "$P1_COUNT" -gt 0 ]; then
          echo "::warning::Found $P1_COUNT high-priority duplicate pairs"
        fi
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: audit-results
        path: audit-results/
        retention-days: 30
    
    - name: Comment on PR (if triggered by PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('audit-results/report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## Content Similarity Audit\n\n' + report
          });
    
    - name: Fail if P1 duplicates found
      if: steps.check.outputs.p1_count > 10
      run: |
        echo "ERROR: Found more than 10 P1 duplicate pairs"
        exit 1
